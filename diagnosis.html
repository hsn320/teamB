<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>カラーズ台湾 - タイル診断</title>
    <meta name="keywords" content="">
    <meta name="description" content="colorsのタイルは全20種類!あなたをタイルに例えると？">

    <!-- OGP項目 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Colors Taiwan - タイル診断">
    <!-- <meta property="og:url" content=""> -->
    <meta property="og:description" content="colorsのタイルは全20種類!あなたをタイルに例えると？">
    <!-- <meta property="og:image" content=""> -->
    <meta property="og:locale" content="ja_JP">
    <meta property="og:site_name" content="Colors Taiwan タイル診断">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Colors Taiwan - タイル診断">
    <meta name="twitter:description" content="colorsのタイルは全20種類!あなたをタイルに例えると？">
    <!-- <meta name="twitter:image" content=""> -->

    <link rel="alternate" hreflang="ja" href="リンク">


    <link rel="stylesheet" href="css/ress.css">
    <link rel="stylesheet" href="css/diagnosis.css">

    <script defer src="js/diagnosis.js"></script>

</head>
<body>

    <div class="contain">

        <div id="startScreen">
            <div class="start-header">
                <span class="header-icon right" onclick="openConfirmModal()">
                    <img src="img/reset.png" alt="閉じる" width="28" height="28" loading="lazy">
                </span>
            </div>
            <div id="startScreenInner">
                <p class="title">あなたをタイルに例えると？<br>チャレンジしてみよう！</p>
                <div class="illustration">

                    <img src="img/people.png" alt="" class="people" height="205" loading="lazy">
                </div>
                <!-- クリック initQuiz() 実行 -->
                <button class="startBtn" onclick="initQuiz()">始める</button>
            </div>
        </div>

        <div id="quizScreen" style="display: none;">

            <div id="quiz-header">
                <!-- 左上：戻るボタン-->
                <span id="backBtn" class="header-icon left" onclick="goBack()" style="display: none;">
                    <img src="img/return.png" alt="戻る" width="40" height="40" loading="lazy">
                </span>
                <!-- 右上：バツボタン-->
                <span id="closeBtn" class="header-icon right" onclick="openConfirmModal()">
                    <img src="img/reset.png" alt="閉じる" width="28" height="28" loading="lazy">
                </span>
            </div>

            <!-- 質問テキスト入れ替わる -->
            <div id="dynamic-content"></div>

            <!-- 位置固定 -->
            <div id="fixed-Action-Area">

                <div class="buttons">
                    <button class="questionBtn noBtn" onclick="answer('nextNo')">No</button>
                    <button class="questionBtn yesBtn" onclick="answer('nextYes')">Yes</button>
                </div>
            </div>
        </div>

        <div id="resultScreen" style="display: none;"></div>

        <div id="confirmModal" style="display: none;">
            <div class="modalInner">
                <p class="modalTitle">本当に診断をやめる？</p>
                <p class="modalDesc">※途中経過は残りません</p>
                <div class="modalButtons">
                    <!-- いいえ モーダルを閉じる -->
                    <button class="modalBtn cancelBtn" onclick="closeConfirmModal()">いいえ</button>
                    <!-- はい スタート画面に戻る -->
                    <button class="modalBtn okBtn" onclick="confirmResetQuiz()">はい</button>
                </div>
            </div>
        </div>

    </div>


</body>
</html>
