<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>磁磚診斷</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    <!-- OGP項目 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="磁磚診斷">
    <meta property="og:url" content="">
    <meta property="og:description" content="">
    <meta property="og:image" content="">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:site_name" content="Colors Taiwan 磁磚診斷">

    <meta name="twitter:card" content="">
    <meta name="twitter:title" content="Colors Taiwan - 磁磚診斷">
    <meta name="twitter:description" content="">
    <meta name="twitter:image" content="">

    <link rel="alternate" hreflang="ja" href="リンク">


    <link rel="stylesheet" href="css/ress.css">
    <link rel="stylesheet" href="css/test.css">

    <script defer src="js/test_tw.js"></script>
</head>
<body>

    <div class="contain">

        <div id="startScreen">
            <div class="start-header">
                <span class="header-icon right" onclick="openConfirmModal()">
                    <img src="img/reset.png" alt="閉じる" width="28" height="28">
                </span>
            </div>
            <div id="startScreenInner">
                <p class="title">如果把你比喻成磁磚？<br>來挑戰看看吧！</p>
                <div class="illustration">

                    <img src="img/people.png" alt="" class="people" height="205">
                </div>
                <!-- クリック initQuiz() 実行 -->
                <button class="startBtn" onclick="initQuiz()">START</button>
            </div>
        </div>

        <div id="quizScreen" style="display: none;">

            <div id="quiz-header">
                <!-- 左上：戻るボタン-->
                <span id="backBtn" class="header-icon left" onclick="goBack()" style="display: none;">
                    <img src="img/return.png" alt="戻る" width="40" height="40">
                </span>
                <!-- 右上：バツボタン-->
                <span id="closeBtn" class="header-icon right" onclick="openConfirmModal()">
                    <img src="img/reset.png" alt="閉じる" width="28" height="28">
                </span>
            </div>

            <!-- 質問テキスト入れ替わる -->
            <div id="dynamic-content"></div>

            <!-- 位置固定 -->
            <div id="fixed-Action-Area">

                <div class="buttons">
                    <button class="questionBtn noBtn" onclick="answer('nextNo')">No</button>
                    <button class="questionBtn yesBtn" onclick="answer('nextYes')">Yes</button>
                </div>
            </div>
        </div>

        <div id="resultScreen" style="display: none;"></div>

        <div id="confirmModal" style="display: none;">
            <div class="modalInner">
                <p class="modalTitle">確定要退出測驗嗎？</p>
                <p class="modalDesc">※目前的作答進度將不會保留</p>
                <div class="modalButtons">
                    <!-- いいえ モーダルを閉じる -->
                    <button class="modalBtn cancelBtn" onclick="closeConfirmModal()">No</button>
                    <!-- はい スタート画面に戻る -->
                    <button class="modalBtn okBtn" onclick="confirmResetQuiz()">Yes</button>
                </div>
            </div>
        </div>

    </div>


</body>
</html>
